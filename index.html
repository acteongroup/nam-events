    --cyan: #00b0db;
    --cyan-dark: #0089ab;
    --navy: #0e2a3a;
    --navy-light: #16384c;
    --bg: #f4f6f8;
    --card-bg: #ffffff;
    --border: #e1e5e9;
    --border-strong: #c7ced4;
    --text-primary: #14222b;
    --text-secondary: #5b6b76;
    --text-muted: #8a98a3;
    --green: #1d9e75;
    --green-bg: #e1f5ee;
    --red: #d85a30;
    --red-bg: #faece7;
    --amber: #ba7517;
    --amber-bg: #faeeda;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(14,42,58,0.06);
    --shadow-md: 0 4px 16px rgba(14,42,58,0.10);
    --shadow-lg: 0 12px 40px rgba(14,42,58,0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
  }
  #app { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; gap: 18px 28px; flex-wrap: wrap;
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 20px 26px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    border-bottom: 3px solid var(--cyan);
  }
  .header .brand { display: flex; align-items: center; gap: 20px; min-width: 0; }
  .brand-logo { height: 44px; width: auto; display: block; flex-shrink: 0; }
  .brand-divider { width: 1px; align-self: stretch; min-height: 42px; background: rgba(255,255,255,0.18); flex-shrink: 0; }
  .brand-text { min-width: 0; }
  .header h1 { font-size: 22px; font-weight: 700; margin: 0; color: #fff; letter-spacing: 0.01em; line-height: 1.15; }
  .header h1 .region { font-weight: 500; color: rgba(255,255,255,0.6); }
  .header .sub { font-size: 13px; color: rgba(255,255,255,0.72); margin: 5px 0 0; }

  /* Right side: status badge stacked above the action buttons */
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; margin-left: auto; }
  .header-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
  .cloud-badge { font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 20px; white-space: nowrap; cursor: help; }
  .cloud-badge.on { background: var(--green-bg); color: var(--green); }
  .cloud-badge.off { background: var(--amber-bg); color: var(--amber); }
  @media (max-width: 760px) {
    .brand-divider { display: none; }
    .header-right { align-items: stretch; width: 100%; }
    .header-badges, .header-actions { justify-content: flex-start; }
  }

  button {
    font-family: inherit; cursor: pointer; border: none; border-radius: var(--radius);
    font-size: 14px; font-weight: 600; padding: 10px 16px; transition: all .15s ease;
  }
  .btn-primary { background: var(--cyan); color: #fff; }
  .btn-primary:hover { background: var(--cyan-dark); }
  .btn-secondary { background: #fff; color: var(--navy); border: 1px solid var(--border-strong); }
  .btn-secondary:hover { background: #f0f3f5; }
  .btn-ghost { background: transparent; color: var(--text-secondary); padding: 6px 10px; }
  .btn-ghost:hover { background: #eef1f3; color: var(--text-primary); }
  .btn-danger { background: var(--red-bg); color: var(--red); }
  .btn-danger:hover { background: #f5d9cb; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Stats bar */
  .stats-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 14px 16px; box-shadow: var(--shadow-sm);
  }
  .stat-card .label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px; }
  .stat-card .value { font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }

  /* Toolbar */
  .toolbar {
    display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; align-items: center;
  }
  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    font-family: inherit; font-size: 14px; padding: 9px 12px; border: 1px solid var(--border-strong);
    border-radius: var(--radius); background: #fff; color: var(--text-primary); width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,176,219,0.15); }
  .search-input { max-width: 280px; }
  .sort-select { max-width: 200px; }

  /* Grid of cards */
  .show-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px;
  }
  .show-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 18px; cursor: pointer; transition: all .15s ease; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 10px; position: relative;
  }
  .show-card:hover { box-shadow: var(--shadow-md); border-color: var(--cyan); transform: translateY(-1px); }
  .show-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .show-card h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--navy); }
  .show-card .loc { font-size: 13px; color: var(--text-secondary); margin: 2px 0 0; }
  .show-card-link { color: var(--cyan-dark); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .show-card-link:hover { text-decoration: underline; }
  .rating-badge { font-size: 12px; font-weight: 700; background: var(--amber-bg); color: var(--amber); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .show-card-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .pill { background: #eef3f6; color: var(--text-secondary); padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .pill.cyan { background: rgba(0,176,219,0.12); color: var(--cyan-dark); }
  /* Event type: small colored dot + quiet text instead of a filled pill */
  .pill.type-dealer, .pill.type-regional { background: none; padding: 3px 2px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
  .pill.type-dealer::before, .pill.type-regional::before { content: ''; width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .pill.type-dealer::before { background: var(--navy); }
  .pill.type-regional::before { background: var(--green); }
  .status-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
  .status-badge.committed { background: var(--green-bg); color: var(--green); }
  .status-badge.planned { background: var(--amber-bg); color: var(--amber); }
  .status-badge.attended { background: rgba(0,176,219,0.15); color: var(--cyan-dark); }
  .status-badge.not-planned { background: #eef1f3; color: var(--text-muted); }
  /* Planned (not yet committed) items get a light amber wash to stand apart */
  .show-card.status-planned { background: #fdf6ea; border-color: #f0e2c8; }
  .plan-row.status-planned { background: #fdf6ea; border-left-color: var(--amber); }
  .show-card-stats { display: flex; gap: 16px; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--border); }
  .show-card-stats div { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
  .show-card-stats span { display: block; font-size: 15px; font-weight: 700; color: var(--navy); margin-top: 2px; }
  .show-card-stats span.green { color: var(--green); }
  .show-card-stats span.red { color: var(--red); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state i { font-size: 13px; }

  /* Budget year comparison */
  .year-compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .year-compare-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; box-shadow: var(--shadow-sm); }
  .year-compare-card .yc-year { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
  .year-compare-card .yc-total { font-size: 24px; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
  .yc-bar-track { height: 8px; border-radius: 4px; background: #eef1f3; overflow: hidden; display: flex; margin-bottom: 8px; }
  .yc-bar-committed { background: var(--green); height: 100%; }
  .yc-bar-planned { background: var(--amber); height: 100%; }
  .yc-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-secondary); }
  .yc-legend span { display: flex; align-items: center; gap: 5px; }
  .yc-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .yc-legend .dot.committed { background: var(--green); }
  .yc-legend .dot.planned { background: var(--amber); }

  .view-toggle { display: flex; gap: 4px; background: #eef1f3; border-radius: var(--radius); padding: 3px; }
  .view-toggle button { background: transparent; border: none; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--text-secondary); border-radius: 7px; }
  .view-toggle button.active { background: #fff; color: var(--navy); box-shadow: var(--shadow-sm); }

  /* Timeline */
  .timeline-group { margin-bottom: 26px; }
  .timeline-group-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
  .timeline-group-header h3 { margin: 0; font-size: 17px; color: var(--navy); font-weight: 700; }
  .timeline-group-header .yc-total-sm { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
  .timeline-row {
    display: grid; grid-template-columns: 90px 1fr auto auto auto; align-items: center; gap: 14px;
    padding: 11px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 8px; cursor: pointer; font-size: 13px;
  }
  .timeline-row:hover { border-color: var(--cyan); box-shadow: var(--shadow-sm); }
  .timeline-row .tl-show-year { color: var(--text-muted); font-weight: 600; }
  .timeline-row .tl-name { font-weight: 700; color: var(--navy); }
  .timeline-row .tl-loc { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .timeline-row .tl-cost { font-weight: 700; color: var(--navy); text-align: right; }
  @media (max-width: 640px) {
    .timeline-row { grid-template-columns: 1fr auto; row-gap: 6px; }
  }

  /* Planning view (date-ordered list) */
  .plan-year-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .plan-year-tab {
    padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 700;
    background: #eef3f6; color: var(--text-secondary); border: 1px solid transparent;
  }
  .plan-year-tab:hover { color: var(--navy); }
  .plan-year-tab.active { background: var(--navy); color: #fff; }
  .plan-summary { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; color: var(--text-secondary); }
  .plan-summary strong { color: var(--navy); font-size: 15px; }
  .plan-sum-committed { color: var(--green); font-weight: 600; }
  .plan-sum-planned { color: var(--amber); font-weight: 600; }
  .plan-sort-toggle { margin-left: auto; background: #fff; color: var(--navy); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 7px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .plan-sort-toggle:hover { background: #f0f3f5; }
  .plan-list { display: flex; flex-direction: column; gap: 8px; }
  .plan-row {
    display: grid; grid-template-columns: 170px 1fr auto auto 96px; align-items: center; gap: 16px;
    padding: 13px 16px; background: var(--card-bg); border: 1px solid var(--border);
    border-left: 4px solid var(--cyan); border-radius: var(--radius); cursor: pointer;
    box-shadow: var(--shadow-sm); transition: all .12s ease;
  }
  .plan-row:hover { border-color: var(--cyan); box-shadow: var(--shadow-md); transform: translateX(2px); }
  .plan-row.undated { border-left-color: var(--border-strong); }
  .plan-date { font-size: 14px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .plan-row.undated .plan-date { color: var(--text-muted); font-weight: 600; font-style: italic; }
  .plan-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .plan-name { font-size: 15px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .plan-yearpill { font-size: 11px; font-weight: 700; background: rgba(0,176,219,0.12); color: var(--cyan-dark); padding: 1px 7px; border-radius: 10px; }
  .plan-loc { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan-cost { font-size: 15px; font-weight: 700; color: var(--navy); text-align: right; }
  @media (max-width: 700px) {
    .plan-row { grid-template-columns: 1fr auto; row-gap: 8px; }
    .plan-date { grid-column: 1 / -1; }
    .plan-cost { text-align: left; }
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(14,42,58,0.55); display: flex;
    align-items: flex-start; justify-content: center; z-index: 1000; padding: 40px 20px;
    overflow-y: auto;
  }
  .modal {
    background: var(--card-bg); border-radius: var(--radius-lg); width: 100%; max-width: 760px;
    box-shadow: var(--shadow-lg); margin-bottom: 40px;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center; padding: 20px 24px;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card-bg);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; z-index: 2;
  }
  .modal-header h2 { margin: 0; font-size: 18px; color: var(--navy); font-weight: 700; }
  .modal-body { padding: 24px; }
  .close-x { background: transparent; border: none; font-size: 20px; color: var(--text-muted); padding: 4px 8px; line-height: 1; }
  .close-x:hover { color: var(--text-primary); background: #eef1f3; border-radius: 6px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .field-row.single { grid-template-columns: 1fr; }
  .field-row.triple { grid-template-columns: 1fr 1fr 1fr; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .field textarea { resize: vertical; min-height: 60px; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: 0.03em; margin: 22px 0 12px; padding-top: 18px; border-top: 1px solid var(--border); }
  .section-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }

  /* Star rating */
  .star-rating { display: flex; gap: 4px; }
  .star-rating button { background: none; border: none; padding: 2px; font-size: 22px; color: var(--border-strong); line-height: 1; }
  .star-rating button.filled { color: var(--amber); }

  /* Tabs for years within a show */
  .year-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .year-tab {
    padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600;
    background: #eef3f6; color: var(--text-secondary); border: 1px solid transparent; cursor: pointer;
  }
  .year-tab.active { background: var(--navy); color: #fff; }
  .year-tab.add-new { background: transparent; border: 1px dashed var(--border-strong); color: var(--text-muted); }
  .year-tab.add-new:hover { color: var(--cyan-dark); border-color: var(--cyan); }

  .roi-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #f7f9fa; border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
  .roi-box .item { text-align: center; }
  .roi-box .item .l { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  .roi-box .item .v { font-size: 16px; font-weight: 700; color: var(--navy); margin-top: 3px; }
  .roi-box .item .v.green { color: var(--green); }
  .roi-box .item .v.red { color: var(--red); }

  /* Reps multi-select */
  .rep-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .rep-chip { background: rgba(0,176,219,0.12); color: var(--cyan-dark); font-size: 12px; font-weight: 600; padding: 5px 8px 5px 10px; border-radius: 16px; display: flex; align-items: center; gap: 6px; }
  .rep-chip button { background: none; border: none; padding: 0; color: var(--cyan-dark); font-size: 14px; line-height: 1; opacity: 0.7; }
  .rep-chip button:hover { opacity: 1; }
  .rep-add-row { display: flex; gap: 6px; margin-top: 8px; }
  .rep-add-row select { flex: 1; }
  .rep-add-row input { flex: 1; }

  /* Image gallery */
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 10px; }
  .gallery-item { position: relative; aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item .rm-btn {
    position: absolute; top: 4px; right: 4px; background: rgba(14,42,58,0.7); color: #fff;
    border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 13px; padding: 0; line-height: 1;
  }
  .upload-zone {
    border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 18px;
    text-align: center; color: var(--text-muted); font-size: 13px; cursor: pointer; margin-top: 10px;
  }
  .upload-zone:hover { border-color: var(--cyan); color: var(--cyan-dark); }
  .upload-zone.dragover { border-color: var(--cyan); background: rgba(0,176,219,0.06); }

  /* Supporting files */
  .file-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .file-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: #f7f9fa; border: 1px solid var(--border); border-radius: var(--radius); }
  .file-item i { font-size: 18px; color: var(--cyan-dark); flex-shrink: 0; }
  .file-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: var(--navy); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-name:hover { color: var(--cyan-dark); text-decoration: underline; }
  .file-size { font-size: 12px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
  .file-rm { background: transparent; border: none; color: var(--text-muted); font-size: 14px; padding: 2px 6px; line-height: 1; flex-shrink: 0; }
  .file-rm:hover { color: var(--red); background: var(--red-bg); border-radius: 6px; }
  .file-empty { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }

  .modal-footer { display: flex; justify-content: space-between; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--border); }
  .modal-footer .right { display: flex; gap: 10px; }

  .confirm-overlay { position: fixed; inset: 0; background: rgba(14,42,58,0.55); display: flex; align-items: center; justify-content: center; z-index: 1100; }
  .confirm-box { background: #fff; border-radius: var(--radius-lg); padding: 22px; max-width: 360px; box-shadow: var(--shadow-lg); }
  .confirm-box p { font-size: 14px; color: var(--text-secondary); margin: 8px 0 18px; }
  .confirm-box h3 { margin: 0; font-size: 16px; color: var(--navy); }
  .confirm-box .row { display: flex; gap: 10px; justify-content: flex-end; }

  .roster-mgmt { display: flex; flex-wrap: wrap; gap: 8px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: #fff; padding: 10px 18px; border-radius: var(--radius);
    font-size: 13px; font-weight: 600; box-shadow: var(--shadow-md); z-index: 1200;
  }
  .loading-screen { display: flex; align-items: center; justify-content: center; padding: 80px; color: var(--text-muted); font-size: 14px; }

  /* Sign-in gate */
  .signin-screen { display: flex; align-items: center; justify-content: center; min-height: 70vh; padding: 40px 20px; }
  .signin-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 36px 32px; max-width: 380px; text-align: center; }
  .signin-card h1 { font-size: 22px; color: var(--navy); margin: 0 0 8px; }
  .signin-card p { font-size: 14px; color: var(--text-secondary); margin: 0 0 22px; }
  .signin-card .btn-primary { width: 100%; padding: 12px; font-size: 15px; }
  .signin-error { color: var(--red); font-size: 13px; margin-top: 14px !important; }
  .user-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-secondary); background: #eef3f6; padding: 8px 12px; border-radius: var(--radius); }
</style>

<body>

      id: uid(),
      year: new Date().getFullYear(),
      budgetYear: new Date().getFullYear(),
      startDate: '',
      endDate: '',
      status: 'planned',
      boothNumber: '',
      boothSize: '',
      boothLayout: 'medium',
      boothRentalCost: '',
      boothRentalYear: new Date().getFullYear(),

      boothSetupYear: new Date().getFullYear(),

      boothSetupContactEmail: '',
      otherCosts: '',
      reps: [], // array of roster ids

  function emptyShow() {

      id: uid(),
      name: '',

  // Only ever render website values as http(s) links — free-text field, guard against
  // javascript: / data: schemes being pasted in and silently prefix bare domains.
  function safeHref(url) {
    const v = String(url || '').trim();
    if (!v) return '';
    return /^https?:\/\//i.test(v) ? v : ('https://' + v);
  }

  function budgetYearOf(a) {
    return a.budgetYear || a.year;
  }
  function rentalYearOf(a) {
    return a.boothRentalYear || budgetYearOf(a);
  }
  function setupYearOf(a) {
    return a.boothSetupYear || budgetYearOf(a);
  }
  function calcExpenses(a) {
    const n = v => parseFloat(v) || 0;
    return n(a.boothRentalCost) + n(a.boothSetupCost) + n(a.otherCosts);
  }
  function calcROI(a) {
    const n = v => parseFloat(v) || 0;
    return n(a.salesGenerated) + n(a.projectedPipeline) - calcExpenses(a);
  }
  function fmtMoney(v) {
    const n = parseFloat(v) || 0;
    return '$' + n.toLocaleString('en-US', {maximumFractionDigits: 0});
  }
  function fmtBytes(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }
  // Pick a Tabler icon based on the file's type/extension.
  function fileIcon(f) {
    const t = (f.type || '').toLowerCase();
    const name = (f.name || '').toLowerCase();
    const ext = name.includes('.') ? name.split('.').pop() : '';
    if (t.includes('pdf') || ext === 'pdf') return 'ti-file-type-pdf';
    if (t.includes('word') || ['doc', 'docx'].includes(ext)) return 'ti-file-type-doc';
    if (t.includes('sheet') || t.includes('excel') || ['xls', 'xlsx', 'csv'].includes(ext)) return 'ti-file-type-xls';
    if (t.includes('presentation') || ['ppt', 'pptx'].includes(ext)) return 'ti-file-type-ppt';
    if (t.startsWith('image/') || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) return 'ti-photo';
    if (t.includes('zip') || ['zip', 'rar', '7z'].includes(ext)) return 'ti-file-zip';
    return 'ti-file';
  }
  function parseLocalDate(s) {
    if (!s) return null;
    const parts = s.split('-').map(Number);
    if (parts.length !== 3 || parts.some(isNaN)) return null;
    return new Date(parts[0], parts[1] - 1, parts[2]);
  }
  function fmtDateRange(a) {
    const start = parseLocalDate(a.startDate);
    const end = parseLocalDate(a.endDate);
    if (!start && !end) return '';
    const opts = { month: 'short', day: 'numeric' };
    if (start && end) {
      const sameMonth = start.getMonth() === end.getMonth() && start.getFullYear() === end.getFullYear();
      const startStr = start.toLocaleDateString('en-US', opts);
      const endStr = sameMonth
        ? end.getDate()
        : end.toLocaleDateString('en-US', opts);
      return `${startStr}–${endStr}, ${end.getFullYear()}`;
    }
    const d = start || end;
    return d.toLocaleDateString('en-US', { ...opts, year: 'numeric' });
  }
  function latestAttendance(show) {
    if (!show.attendances || !show.attendances.length) return null;
    return [...show.attendances].sort((a,b) => b.year - a.year)[0];
  }
  function repName(id) {
    const r = roster.find(r => r.id === id);
    return r ? r.name : '(removed)';
  }
  function showType(s) {
    return s.type || 'dealer';
  }
  function typeLabel(t) {
    return t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
  }
  // Shows passing the active Type filter — the basis for every view (cards, timeline, budget bars, stats)
  function typeFilteredShows() {
    if (typeFilter === 'all') return shows;
    return shows.filter(s => showType(s) === typeFilter);
  }

  function showToast(msg) {
    toastMsg = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastMsg = null; render(); }, 2200);
  }

  // ---------- Storage ----------
  // Resilient persistence: prefer window.storage when it works, but always
  // mirror to localStorage so data survives a refresh even if window.storage
  // is unavailable or rejects in this environment.
  const LS_PREFIX = 'acteon-tradeshow-';

  async function storageGet(key) {
    let val = null;
    if (window.storage && typeof window.storage.get === 'function') {
      try {
        const r = await window.storage.get(key);
        if (r && r.value != null) val = r.value;
      } catch (e) { /* fall through to localStorage */ }
    }
    if (val == null) {
      try {
        const v = localStorage.getItem(LS_PREFIX + key);
        if (v != null) val = v;
      } catch (e) { /* ignore */ }
    }
    return val;
  }

  async function storageSet(key, value) {
    let ok = false;
    // localStorage is the reliable local backing — write it first.
    try { localStorage.setItem(LS_PREFIX + key, value); ok = true; } catch (e) { /* quota? */ }
    if (window.storage && typeof window.storage.set === 'function') {
      try { await window.storage.set(key, value); ok = true; } catch (e) { /* ignore */ }
    }
    if (!ok) throw new Error('persist failed');
  }

  // Photos live in their own `images` collection (so show docs stay under the
  // 1 MB Firestore limit). Re-attach them onto each attendance's `images` array.
  // `prev` is the previous in-memory shows, used as a fallback only before the
  // images collection has loaded, to avoid photos flickering away on first paint.
  function fillImages(prev) {
    if (!useCloud) return; // local mode keeps images inline in the cached shows
    shows.forEach(s => {
      s.attendances.forEach(a => {
        if (remoteImageDocs) {
          const cloud = remoteImageDocs
            .filter(d => d.showId === s.id && d.attId === a.id)
            .sort((x, y) => (x.ts || 0) - (y.ts || 0))
            .map(d => ({ id: d.id, dataUrl: d.dataUrl, caption: d.caption || '' }));
          if (!cloud.length && Array.isArray(a.images) && a.images.length) {
            // Legacy photos stored inline in the show doc — migrate them to the
            // images collection (keep showing them; the next snapshot carries them).
            a.images.forEach(img => { if (img && img.dataUrl) cloudSaveImage(s.id, a.id, img); });
          } else {
            a.images = cloud;
          }
        } else {
          const ps = (prev || []).find(p => p.id === s.id);
          const pa = ps && ps.attendances.find(x => x.id === a.id);
          a.images = (pa && pa.images) ? pa.images : (a.images || []);
        }
      });
    });
  }

  // Supporting files live in their own `files` collection (same reason as photos
  // — keep show docs under the 1 MB limit). Re-attach onto each attendance `files`.
  function fillFiles(prev) {
    if (!useCloud) return; // local mode keeps files inline in the cached shows
    shows.forEach(s => {
      s.attendances.forEach(a => {
        if (remoteFileDocs) {
          const cloud = remoteFileDocs
            .filter(d => d.showId === s.id && d.attId === a.id)
            .sort((x, y) => (x.ts || 0) - (y.ts || 0))
            .map(d => ({ id: d.id, dataUrl: d.dataUrl, name: d.name || 'file', type: d.type || '', size: d.size || 0 }));
          if (!cloud.length && Array.isArray(a.files) && a.files.length) {
            a.files.forEach(f => { if (f && f.dataUrl) cloudSaveFile(s.id, a.id, f); });
          } else {
            a.files = cloud;
          }
        } else {
          const ps = (prev || []).find(p => p.id === s.id);
          const pa = ps && ps.attendances.find(x => x.id === a.id);
          a.files = (pa && pa.files) ? pa.files : (a.files || []);
        }
      });
    });
  }

  // Apply a fresh shows snapshot from Firestore. Held back while a modal is open
  // so an incoming update can't clobber edits in progress.
  function applyRemoteShows(remote) {
    if (modalShowId) { pendingRemoteShows = remote; return; }
    const prev = shows;
    shows = remote;
    fillImages(prev);
    fillFiles(prev);
    try { localStorage.setItem(LS_PREFIX + 'shows', JSON.stringify(shows)); } catch(e) {}
    render();
  }
  // Re-attach images after the images collection updates.
  function applyRemoteImages(docs) {
    remoteImageDocs = docs;
    if (modalShowId) { pendingImageSync = true; return; }
    fillImages(shows);
    try { localStorage.setItem(LS_PREFIX + 'shows', JSON.stringify(shows)); } catch(e) {}
    render();
  }
  // Re-attach files after the files collection updates.
  function applyRemoteFiles(docs) {
    remoteFileDocs = docs;
    if (modalShowId) { pendingFileSync = true; return; }
    fillFiles(shows);
    try { localStorage.setItem(LS_PREFIX + 'shows', JSON.stringify(shows)); } catch(e) {}
    render();
  }
  // Called from closeModal — flush any update that arrived while editing.
  function flushPendingRemote() {
    if (modalShowId) return;
    if (!pendingRemoteShows && !pendingImageSync && !pendingFileSync) return;
    const prev = shows;
    if (pendingRemoteShows) {
      shows = pendingRemoteShows;
      pendingRemoteShows = null;
    }
    fillImages(prev); // re-attach photos (applied show docs have images stripped)
    fillFiles(prev);  // re-attach files (applied show docs have files stripped)
    pendingImageSync = false;
    pendingFileSync = false;
    try { localStorage.setItem(LS_PREFIX + 'shows', JSON.stringify(shows)); } catch(e) {}
  }

  // ---------- Auth (Microsoft SSO) ----------
  function signInMicrosoft() {
    if (!auth) return;
    authError = '';
    renderSignIn();
    const provider = new firebase.auth.OAuthProvider('microsoft.com');
    provider.setCustomParameters({
      prompt: 'select_account',
      tenant: window.ACTEON_TENANT_ID || 'common'
    });
    auth.signInWithPopup(provider).catch(err => {
      console.error('sign-in failed', err);
      authError = err && err.message ? err.message : 'Sign-in failed. Please try again.';
      renderSignIn();
    });
  }
  function signOutUser() {
    if (!auth) return;
    auth.signOut().catch(e => console.error('sign-out failed', e));
    // onAuthStateChanged will re-render the sign-in gate
  }
  function renderSignIn() {
    const app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = `
      <div class="signin-screen">
        <div class="signin-card">
          <h1>Event Tracker <span class="region">| North America</span></h1>
          <p>Sign in with your Microsoft account to continue.</p>
          <button class="btn-primary" id="signin-btn"><i class="ti ti-brand-windows"></i> Sign in with Microsoft</button>
          ${authError ? `<p class="signin-error">${esc(authError)}</p>` : ''}
        </div>
      </div>`;
    const btn = document.getElementById('signin-btn');
    if (btn) btn.addEventListener('click', signInMicrosoft);
  }

  async function loadData() {
    // Instant paint from the local cache first…
    try {
      const v = await storageGet('shows');
      shows = v ? JSON.parse(v) : [];
    } catch(e) { shows = []; }
    try {
      const v = await storageGet('roster');
      roster = v ? JSON.parse(v) : [];
    } catch(e) { roster = []; }
    if (!useCloud) {
      try { rosterSeeded = localStorage.getItem(LS_PREFIX + 'rosterSeeded') === '1'; } catch(e) {}
      maybeSeedRoster();
    } // cloud mode seeds after the first roster snapshot
    loaded = true;
    render();

    // …then, in cloud mode, subscribe to live updates (shared across users).
    if (useCloud && db) {
      db.collection('shows').onSnapshot(
        snap => applyRemoteShows(snap.docs.map(d => d.data())),
        err => { console.error('shows sync error', err); showToast('Cloud connection issue'); }
      );
      db.collection('images').onSnapshot(
        snap => applyRemoteImages(snap.docs.map(d => d.data())),
        err => console.error('images sync error', err)
      );
      db.collection('files').onSnapshot(
        snap => applyRemoteFiles(snap.docs.map(d => d.data())),
        err => console.error('files sync error', err)
      );
      db.collection('meta').doc('roster').onSnapshot(
        doc => {
          const data = doc.exists ? doc.data() : null;
          roster = (data && Array.isArray(data.reps)) ? data.reps : [];
          if (data && data.seeded) rosterSeeded = true;
          maybeSeedRoster(); // one-time import of the Territory rep list
          try { localStorage.setItem(LS_PREFIX + 'roster', JSON.stringify(roster)); } catch(e) {}
          if (!modalShowId) render();
        },
        err => console.error('roster sync error', err)
      );
    }
  }

  async function saveShows() {
    if (!useCloud || !db) {
      // local-only mode: localStorage is the only backing
      try { await storageSet('shows', JSON.stringify(shows)); }
      catch(e) { showToast('Save failed — try again'); }
      return;
    }
    // cloud mode: update local cache (best-effort) then push to Firestore
    try { await storageSet('shows', JSON.stringify(shows)); } catch(e) {}
    try {
      const batch = db.batch();
      shows.forEach(s => {
        // JSON round-trip strips any `undefined` fields, which Firestore rejects.
        const copy = JSON.parse(JSON.stringify(s));
        // Photos and files are stored in their own collections, not inside the
        // show doc, so the doc stays well under Firestore's 1 MB limit.
        copy.attendances.forEach(a => { a.images = []; a.files = []; });
        batch.set(db.collection('shows').doc(s.id), copy);
      });
      await batch.commit();
      pendingRemoteShows = null; // our write will trigger the authoritative snapshot
    } catch(e) {
      console.error('cloud save failed', e);
      showToast('Cloud save failed — saved locally');
    }
  }
  async function cloudDeleteShow(id) {
    if (!useCloud || !db) return;
    try {
      await db.collection('shows').doc(id).delete();
      await deleteImageDocsWhere(['showId', '==', id]);
      await deleteFileDocsWhere(['showId', '==', id]);
    } catch(e) { console.error('cloud delete failed', e); }
  }
  // Write one photo as its own document in the `images` collection.
  function cloudSaveImage(showId, attId, img) {
    if (!useCloud || !db) return;
    db.collection('images').doc(img.id).set({
      id: img.id, showId, attId, dataUrl: img.dataUrl, caption: img.caption || '', ts: Date.now()
    }).catch(e => { console.error('image save failed', e); showToast('Photo save failed — try a smaller image'); });
  }
  function cloudDeleteImage(imgId) {
    if (!useCloud || !db) return;
    db.collection('images').doc(imgId).delete().catch(e => console.error('image delete failed', e));
  }
  // Delete every image doc matching a where-clause (used when a show/year is removed).
  async function deleteImageDocsWhere(...clauses) {
    if (!useCloud || !db) return;
    let q = db.collection('images');
    clauses.forEach(c => { q = q.where(c[0], c[1], c[2]); });
    const snap = await q.get();
    if (snap.empty) return;
    const batch = db.batch();
    snap.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
  // Write one supporting file as its own document in the `files` collection.
  function cloudSaveFile(showId, attId, f) {
    if (!useCloud || !db) return;
    db.collection('files').doc(f.id).set({
      id: f.id, showId, attId, dataUrl: f.dataUrl, name: f.name || 'file',
      type: f.type || '', size: f.size || 0, ts: Date.now()
    }).catch(e => { console.error('file save failed', e); showToast('File save failed — try a smaller file'); });
  }
  function cloudDeleteFile(fileId) {
    if (!useCloud || !db) return;
    db.collection('files').doc(fileId).delete().catch(e => console.error('file delete failed', e));
  }
  // Delete every file doc matching a where-clause (used when a show/year is removed).
  async function deleteFileDocsWhere(...clauses) {
    if (!useCloud || !db) return;
    let q = db.collection('files');
    clauses.forEach(c => { q = q.where(c[0], c[1], c[2]); });
    const snap = await q.get();
    if (snap.empty) return;
    const batch = db.batch();
    snap.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
  async function saveRoster() {
    try { await storageSet('roster', JSON.stringify(roster)); } catch(e) {}
    try { localStorage.setItem(LS_PREFIX + 'rosterSeeded', rosterSeeded ? '1' : '0'); } catch(e) {}
    if (useCloud && db) {
      try { await db.collection('meta').doc('roster').set({ reps: roster, seeded: rosterSeeded }); }
      catch(e) { console.error('roster cloud save failed', e); }
    }
  }

  // Default rep roster imported from the Acteon Territory Finder app. Merged in
  // ONCE (guarded by a persisted `seeded` flag), so removing reps later sticks
  // and the list isn't re-added on every load.
  const DEFAULT_REPS = [
    'Craig Hennings', 'Nick Frank', 'Thomas Dunn', 'Moh Hamdan', 'Christy Pate',
    'Chris Strange', 'Ryan Renaud', 'Ray Degrazia', 'Elizabeth Paul', 'CJ Young',
    'Rachel Torres', 'Addison Holstein', 'Erik Smith', 'Kevin Cronin', 'Talha Gonca',
    'Jim Curd', 'Brad Klein', 'Rick Mulhern', 'Mantas Armonas', 'Patrick Fagan',
    'John Catania', 'Brooke Jenson', 'Colton Ruff', 'Peter Shea', 'Steve Andregg',
    'Blake Brownell', 'Haywood Fox', 'David Teter', 'Jason Halsey', 'Kevin Upchurch',
    'Sean Mitchell', 'Steve Barnes', 'Lee Davis', 'Kristi Henderson'
  ];
  let rosterSeeded = false;
  let rosterSeedAttempted = false;
  function maybeSeedRoster() {
    if (rosterSeedAttempted || rosterSeeded) return;
    rosterSeedAttempted = true;
    const seen = new Set(roster.map(r => r.name.toLowerCase()));
    DEFAULT_REPS.forEach(name => {
      if (!seen.has(name.toLowerCase())) { roster.push({ id: uid(), name }); seen.add(name.toLowerCase()); }
    });
    rosterSeeded = true;
    saveRoster();
  }

  // ---------- Mutations ----------
  function openNewShowModal() {
    const s = emptyShow();
    shows.unshift(s);
    modalShowId = s.id;
    modalIsNewShow = true;
    modalActiveAttendanceId = s.attendances[0].id;
    render();
  }
  function openShowModal(id, attId) {
    modalShowId = id;
    modalIsNewShow = false;
    const show = shows.find(s => s.id === id);
    modalActiveAttendanceId = (attId && show && show.attendances.some(a => a.id === attId))
      ? attId
      : (latestAttendance(show)?.id || null);
    render();
  }
  async function closeModal() {
    // if it was a new show and name is blank, discard it
    if (modalIsNewShow) {
      const s = shows.find(s => s.id === modalShowId);
      if (s && !s.name.trim()) {
        shows = shows.filter(x => x.id !== modalShowId);
      }
    }
    modalShowId = null;
    modalIsNewShow = false;
    modalActiveAttendanceId = null;
    await saveShows();
    flushPendingRemote(); // apply any live update that arrived while editing
    render();
  }
  function getModalShow() { return shows.find(s => s.id === modalShowId); }

  function updateShowField(field, value) {
    const s = getModalShow(); if (!s) return;
    s[field] = value;
    render();
  }
  function updateAttendanceField(attId, field, value) {
    const s = getModalShow(); if (!s) return;
    const a = s.attendances.find(a => a.id === attId); if (!a) return;
    a[field] = value;
    render();
  }
  function addAttendanceYear() {
    const s = getModalShow(); if (!s) return;
    const years = s.attendances.map(a => a.year);
    const newA = emptyAttendance();
    newA.year = years.length ? Math.max(...years) + 1 : new Date().getFullYear();
    newA.budgetYear = newA.year;
    newA.boothRentalYear = newA.year;
    newA.boothSetupYear = newA.year;
    s.attendances.push(newA);
    modalActiveAttendanceId = newA.id;
    render();
  }
  function deleteAttendance(attId) {
    const s = getModalShow(); if (!s) return;
    if (s.attendances.length <= 1) { showToast("Can't delete the only year — delete the event instead"); return; }
    s.attendances = s.attendances.filter(a => a.id !== attId);
    modalActiveAttendanceId = latestAttendance(s)?.id;
    confirmDelete = null;
    render();
    deleteImageDocsWhere(['showId', '==', s.id], ['attId', '==', attId])
      .catch(e => console.error('image cleanup failed', e));
    deleteFileDocsWhere(['showId', '==', s.id], ['attId', '==', attId])
      .catch(e => console.error('file cleanup failed', e));
  }
  function deleteShow(id) {
    shows = shows.filter(s => s.id !== id);
    confirmDelete = null;
    modalShowId = null;
    saveShows();
    cloudDeleteShow(id); // batch.set only writes existing docs — remove the doc explicitly
    showToast('Event deleted');
    render();
  }

  function setRating(val) {
    const s = getModalShow(); if (!s) return;
    s.rating = s.rating === val ? 0 : val;
    render();
  }

  function addRepToAttendance(attId, repId) {
    if (!repId) return;
    const s = getModalShow(); if (!s) return;
    const a = s.attendances.find(a => a.id === attId); if (!a) return;
    if (!a.reps.includes(repId)) a.reps.push(repId);
    render();
  }
  function removeRepFromAttendance(attId, repId) {
    const s = getModalShow(); if (!s) return;
    const a = s.attendances.find(a => a.id === attId); if (!a) return;
    a.reps = a.reps.filter(r => r !== repId);
    render();
  }
  function addNewRepInline(attId, name) {
    name = name.trim();
    if (!name) return;
    let r = roster.find(r => r.name.toLowerCase() === name.toLowerCase());
    if (!r) {
      r = { id: uid(), name };
      roster.push(r);
      saveRoster();
    }
    addRepToAttendance(attId, r.id);
  }

  // Downscale + re-encode an image so it stays small enough to live inside a
  // Firestore document (1 MB/doc limit). Returns a JPEG data URL.
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            const scale = maxDim / Math.max(width, height);
            width = Math.round(width * scale);
            height = Math.round(height * scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          try { resolve(canvas.toDataURL('image/jpeg', quality)); }
          catch (err) { resolve(e.target.result); } // fallback: original
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function handleFiles(attId, files) {
    const s = getModalShow(); if (!s) return;
    const a = s.attendances.find(a => a.id === attId); if (!a) return;
    [...files].forEach(async file => {
      if (!file.type.startsWith('image/')) return;
      if (file.size > 15 * 1024 * 1024) { showToast(file.name + ' is too large (max 15MB)'); return; }
      try {
        const dataUrl = await compressImage(file, 1100, 0.68);
        const img = { id: uid(), dataUrl, caption: '' };
        a.images.push(img);
        render();
        cloudSaveImage(s.id, attId, img); // persist immediately to the images collection
      } catch (e) {
        showToast('Could not process ' + file.name);
      }
    });
  }
  function removeImage(attId, imgId) {
    const s = getModalShow(); if (!s) return;
    const a = s.attendances.find(a => a.id === attId); if (!a) return;
    a.images = a.images.filter(i => i.id !== imgId);
    render();
    cloudDeleteImage(imgId);
  }

  // Read an arbitrary file into a base64 data URL (no re-encoding).
  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }
  // Supporting documents (PDFs, Office files, etc.) stored as their own docs in
  // the `files` collection. Capped so each stays under Firestore's 1 MB per-doc
  // limit (base64 inflates the raw bytes by ~33%).
  const MAX_FILE_BYTES = 700 * 1024;
  function handleSupportingFiles(attId, files) {
    const s = getModalShow(); if (!s) return;
    const a = s.attendances.find(a => a.id === attId); if (!a) return;
    if (!Array.isArray(a.files)) a.files = [];
    [...files].forEach(async file => {
      if (file.size > MAX_FILE_BYTES) {
        showToast(file.name + ' is too large (max 700 KB per file)');
        return;
      }
      try {
        const dataUrl = await readFileAsDataURL(file);
        const f = { id: uid(), dataUrl, name: file.name, type: file.type || '', size: file.size };
        a.files.push(f);
        render();
        cloudSaveFile(s.id, attId, f); // persist immediately to the files collection
      } catch (e) {
        showToast('Could not read ' + file.name);
      }
    });
  }
  function removeSupportingFile(attId, fileId) {
    const s = getModalShow(); if (!s) return;
    const a = s.attendances.find(a => a.id === attId); if (!a) return;
    a.files = (a.files || []).filter(f => f.id !== fileId);
    render();
    cloudDeleteFile(fileId);
  }

  // ---------- Computed / filtering ----------
  function getFilteredSortedShows() {
    let list = [...typeFilteredShows()];
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      list = list.filter(s =>
        s.name.toLowerCase().includes(q) ||
        s.location.toLowerCase().includes(q) ||
        (latestAttendance(s)?.reps || []).some(r => repName(r).toLowerCase().includes(q))
      );
    }
    list.sort((a,b) => {
      if (sortMode === 'name') return a.name.localeCompare(b.name);
      if (sortMode === 'rating') return (b.rating||0) - (a.rating||0);
      if (sortMode === 'roi') {
        const ra = latestAttendance(a) ? calcROI(latestAttendance(a)) : -Infinity;
        const rb = latestAttendance(b) ? calcROI(latestAttendance(b)) : -Infinity;
        return rb - ra;
      }
      if (sortMode === 'recent') {
        const ya = latestAttendance(a)?.year || 0;
        const yb = latestAttendance(b)?.year || 0;
        return yb - ya;
      }
      if (sortMode === 'status') {
        const order = { committed: 0, attended: 1, planned: 2, 'not-planned': 3 };
        const sa = order[latestAttendance(a)?.status || 'planned'];
        const sb = order[latestAttendance(b)?.status || 'planned'];
        return sa - sb;
      }
      return 0;
    });
    return list;
  }

  // Distinct show years present (respecting the Type filter) — drives the year tabs.
  function getPlanningYears() {
    const set = new Set();
    typeFilteredShows().forEach(s => s.attendances.forEach(a => set.add(a.year)));
    return [...set].sort((x, y) => x - y);
  }

  // One row per attendance for the selected year (or all), sorted by show start date.
  function getPlanningRows() {
    const q = searchQuery.trim().toLowerCase();
    const rows = [];
    typeFilteredShows().forEach(s => {
      const matches = !q ||
        s.name.toLowerCase().includes(q) ||
        s.location.toLowerCase().includes(q) ||
        (latestAttendance(s)?.reps || []).some(r => repName(r).toLowerCase().includes(q));
      if (!matches) return;
      s.attendances.forEach(a => {
        if (planningYear !== 'all' && a.year !== planningYear) return;
        rows.push({ show: s, a });
      });
    });
    const dir = planSortDir === 'desc' ? -1 : 1;
    rows.sort((r1, r2) => {
      const d1 = r1.a.startDate || '';
      const d2 = r2.a.startDate || '';
      // Undated rows always sort to the bottom regardless of direction.
      if (!d1 && !d2) return r1.show.name.localeCompare(r2.show.name);
      if (!d1) return 1;
      if (!d2) return -1;
      // ISO yyyy-mm-dd strings sort correctly as plain text.
      return d1 < d2 ? -1 * dir : d1 > d2 ? 1 * dir : 0;
    });
    return rows;
  }

  function getByBudgetYear() {
    const map = {}; // year -> {planned, committed, total, lines: [{show, a, label, amount}]}
    const n = v => parseFloat(v) || 0;
    const ensure = (y) => {
      if (!map[y]) map[y] = { year: y, planned: 0, committed: 0, total: 0, lines: [] };
      return map[y];
    };
    typeFilteredShows().forEach(s => {
      s.attendances.forEach(a => {
        const st = a.status || 'planned';
        const costLines = [
          { label: 'Booth rental', amount: n(a.boothRentalCost), year: rentalYearOf(a) },
          { label: 'Booth setup', amount: n(a.boothSetupCost), year: setupYearOf(a) },
          { label: 'Other costs', amount: n(a.otherCosts), year: budgetYearOf(a) }
        ];
        costLines.forEach(line => {
          if (!line.amount) return;
          const bucket = ensure(line.year);
          if (st === 'planned') bucket.planned += line.amount;
          else if (st === 'committed') bucket.committed += line.amount;
          if (st !== 'not-planned') bucket.total += line.amount;
          bucket.lines.push({ show: s, a, label: line.label, amount: line.amount });
        });
        // ensure a year bucket exists even if all costs are 0, so the show still appears somewhere
        if (!costLines.some(l => l.amount)) {
          ensure(budgetYearOf(a));
        }
      });
    });
    return Object.values(map).sort((x,y) => x.year - y.year);
  }

  function getOverallStats() {
    let totalROI = 0, totalSales = 0, totalPipeline = 0, totalExpense = 0, count = 0;
    let plannedBudget = 0, committedBudget = 0, plannedCount = 0, committedCount = 0, notPlannedCount = 0;
    const scoped = typeFilteredShows();
    scoped.forEach(s => {
      s.attendances.forEach(a => {
        const st = a.status || 'planned';
        // Results (ROI/sales) only count once a show has actually been attended.
        if (st === 'attended') {
          totalROI += calcROI(a);
          totalSales += parseFloat(a.salesGenerated)||0;
          totalPipeline += parseFloat(a.projectedPipeline)||0;
          totalExpense += calcExpenses(a);
          count++;
        }
        if (st === 'planned') { plannedBudget += calcExpenses(a); plannedCount++; }
        else if (st === 'committed') { committedBudget += calcExpenses(a); committedCount++; }
        else { notPlannedCount++; }
      });
    });
    return {
      totalROI, totalSales, totalPipeline, totalExpense, count, showCount: scoped.length,
      plannedBudget, committedBudget, plannedCount, committedCount, notPlannedCount,
      totalBudget: plannedBudget + committedBudget
    };
  }

  // ---------- Excel export ----------
  // One worksheet per show year (each attendance filed under its year), so the
  // workbook is naturally "separated by year". Amounts export as raw numbers (USD)
  // so Excel can total them.
  function exportToExcel() {
    if (typeof XLSX === 'undefined') { showToast('Excel library still loading — try again in a moment'); return; }
    const num = v => parseFloat(v) || 0;
    const byYear = {};
    shows.forEach(s => {
      (s.attendances || []).forEach(a => {
        const y = a.year || budgetYearOf(a);
        (byYear[y] = byYear[y] || []).push({ s, a });
      });
    });
    const years = Object.keys(byYear).map(Number).sort((x, y) => x - y);
    if (!years.length) { showToast('Nothing to export yet'); return; }

    const wb = XLSX.utils.book_new();
    years.forEach(y => {
      const rows = byYear[y]
        .sort((r1, r2) => (r1.a.startDate || '').localeCompare(r2.a.startDate || '') || r1.s.name.localeCompare(r2.s.name))
        .map(({ s, a }) => ({
          'Event': s.name || 'Untitled event',
          'Location': s.location || '',
          'Type': typeLabel(showType(s)),
          'Status': (a.status || 'planned').replace('-', ' '),
          'Start date': a.startDate || '',
          'End date': a.endDate || '',
          'Booth #': a.boothNumber || '',
          'Booth size': a.boothSize || '',
          'Booth layout': a.boothLayout || '',
          'Reps': (a.reps || []).map(repName).join(', '),
          'Booth rental ($)': num(a.boothRentalCost),
          'Booth setup ($)': num(a.boothSetupCost),
          'Other costs ($)': num(a.otherCosts),
          'Total expenses ($)': calcExpenses(a),
          'Sales ($)': num(a.salesGenerated),
          'Pipeline ($)': num(a.projectedPipeline),
          'ROI ($)': calcROI(a),
          'Rating': s.rating || '',
          'Website': s.website || '',
          'Contact name': s.contactName || '',
          'Contact email': s.contactEmail || '',
          'Notes': a.notes || ''
        }));
      const ws = XLSX.utils.json_to_sheet(rows);
      ws['!cols'] = [
        { wch: 28 }, { wch: 20 }, { wch: 10 }, { wch: 12 }, { wch: 12 }, { wch: 12 },
        { wch: 8 }, { wch: 11 }, { wch: 12 }, { wch: 24 }, { wch: 15 }, { wch: 15 },
        { wch: 14 }, { wch: 17 }, { wch: 12 }, { wch: 12 }, { wch: 12 }, { wch: 8 }, { wch: 30 }, { wch: 20 }, { wch: 28 }, { wch: 40 }
      ];
      XLSX.utils.book_append_sheet(wb, ws, String(y));
    });
    const stamp = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(wb, `Events_NorthAmerica_${stamp}.xlsx`);
    showToast(`Exported ${years.length} ${years.length === 1 ? 'year' : 'years'} to Excel`);
  }

  // ---------- Excel import ----------
  // Reads the same format Export produces: one worksheet per year (sheet name =
  // year), columns matched by header (case-insensitively, with a few aliases).
  // Rows are matched to existing shows by name so a round-trip merges instead of
  // duplicating; each row updates (or adds) that show's matching year.
  function importRowGetter(row) {
    const map = {};
    Object.keys(row).forEach(k => { map[String(k).trim().toLowerCase()] = row[k]; });
    return (aliases) => {
      for (const a of aliases) {
        const v = map[a];
        if (v !== undefined && v !== null && v !== '') return v;
      }
      return '';
    };
  }
  function importParseType(v) { return String(v).trim().toLowerCase().startsWith('reg') ? 'regional' : 'dealer'; }
  function importParseStatus(v) {
    const s = String(v).trim().toLowerCase().replace(/\s+/g, '-');
    return ['planned', 'committed', 'attended', 'not-planned'].includes(s) ? s : 'planned';
  }
  function importParseLayout(v) {
    const s = String(v).trim().toLowerCase();
    return ['small', 'medium', 'large'].includes(s) ? s : 'medium';
  }
  function importNum(v) {
    if (v === '' || v === null || v === undefined) return '';
    const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
    return isFinite(n) ? n : '';
  }
  // Normalise a date cell (Excel Date object, serial number, or text) to YYYY-MM-DD.
  function importParseDate(v) {
    if (v === '' || v === null || v === undefined) return '';
    const fmt = (y, m, d) => `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (v instanceof Date && !isNaN(v)) return fmt(v.getFullYear(), v.getMonth() + 1, v.getDate());
    if (typeof v === 'number' && isFinite(v)) {
      const dt = new Date(Math.round((v - 25569) * 86400 * 1000));
      return isNaN(dt) ? '' : fmt(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
    }
    const s = String(v).trim();
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
    const dt = new Date(s);
    return isNaN(dt) ? '' : fmt(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  }

  function handleImportFile(file) {
    if (typeof XLSX === 'undefined') { showToast('Excel library still loading — try again in a moment'); return; }
    const reader = new FileReader();
    reader.onerror = () => showToast('Could not read ' + file.name);
    reader.onload = (e) => {
      let wb;
      try { wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true }); }
      catch (err) { console.error(err); showToast('Could not parse ' + file.name); return; }
      const parsed = [];
      let skipped = 0;
      wb.SheetNames.forEach(sheetName => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '', raw: true });
        const sheetYear = /^\d{4}$/.test(String(sheetName).trim()) ? parseInt(sheetName, 10) : null;
        rows.forEach(row => {
          const get = importRowGetter(row);
          const name = String(get(['trade show', 'show', 'event', 'congress', 'name', 'show name', 'trade show name'])).trim();
          if (!name) { skipped++; return; }
          let year = sheetYear;
          if (!year) { const yy = parseInt(get(['year', 'show year']), 10); if (yy) year = yy; }
          if (!year) year = new Date().getFullYear();
          const rawRating = parseInt(get(['rating']), 10);
          parsed.push({
            name, year,
            location: String(get(['location', 'city'])).trim(),
            website: String(get(['website', 'url', 'link'])).trim(),
            contactName: String(get(['contact name', 'contact'])).trim(),
            contactEmail: String(get(['contact email', 'email'])).trim(),
            type: get(['type', 'show type']) ? importParseType(get(['type', 'show type'])) : '',
            rating: (rawRating >= 0 && rawRating <= 5) ? rawRating : '',
            status: get(['status']) ? importParseStatus(get(['status'])) : '',
            startDate: importParseDate(get(['start date', 'start'])),
            endDate: importParseDate(get(['end date', 'end'])),
            boothNumber: String(get(['booth #', 'booth number', 'booth'])).trim(),
            boothSize: String(get(['booth size'])).trim(),
            boothLayout: get(['booth layout', 'layout']) ? importParseLayout(get(['booth layout', 'layout'])) : '',
            repsRaw: String(get(['reps', 'rep', 'representatives'])).trim(),
            boothRentalCost: importNum(get(['booth rental ($)', 'booth rental', 'rental'])),
            boothSetupCost: importNum(get(['booth setup ($)', 'booth setup', 'setup'])),
            otherCosts: importNum(get(['other costs ($)', 'other costs', 'other'])),
            salesGenerated: importNum(get(['sales ($)', 'sales'])),
            projectedPipeline: importNum(get(['pipeline ($)', 'pipeline'])),
            notes: String(get(['notes'])).trim()
          });
        });
      });
      if (!parsed.length) { showToast(skipped ? 'No rows with an event name found' : 'No data found in ' + file.name); return; }
      const existing = new Set(shows.map(s => s.name.trim().toLowerCase()));
      const seen = new Set();
      let newShows = 0;
      parsed.forEach(p => {
        const key = p.name.toLowerCase();
        if (!existing.has(key) && !seen.has(key)) newShows++;
        seen.add(key);
      });
      importPreview = {
        fileName: file.name,
        rows: parsed,
        summary: { rows: parsed.length, shows: seen.size, newShows, updatedShows: seen.size - newShows, skipped }
      };
      render();
    };
    reader.readAsArrayBuffer(file);
  }

  function applyImport() {
    if (!importPreview) return;
    const byName = {};
    shows.forEach(s => { byName[s.name.trim().toLowerCase()] = s; });
    let createdShows = 0, yearRows = 0, rosterChanged = false;
    const resolveReps = (str) => {
      const ids = [];
      String(str).split(/[,;]/).map(x => x.trim()).filter(Boolean).forEach(nm => {
        let r = roster.find(rr => rr.name.toLowerCase() === nm.toLowerCase());
        if (!r) { r = { id: uid(), name: nm }; roster.push(r); rosterChanged = true; }
        if (!ids.includes(r.id)) ids.push(r.id);
      });
      return ids;
    };
    importPreview.rows.forEach(p => {
      const key = p.name.toLowerCase();
      let s = byName[key];
      if (!s) {
        s = emptyShow();
        s.name = p.name;
        s.attendances = []; // populated below
        shows.unshift(s);
        byName[key] = s;
        createdShows++;
      }
      // Show-level fields — set only when the import provides a value.
      if (p.location) s.location = p.location;
      if (p.website) s.website = p.website;
      if (p.contactName) s.contactName = p.contactName;
      if (p.contactEmail) s.contactEmail = p.contactEmail;
      if (p.type) s.type = p.type;
      if (p.rating !== '') s.rating = p.rating;
      // Attendance for this year — update if present, else add.
      let a = s.attendances.find(x => x.year === p.year);
      if (!a) {
        a = emptyAttendance();
        a.year = p.year; a.budgetYear = p.year; a.boothRentalYear = p.year; a.boothSetupYear = p.year;
        s.attendances.push(a);
      }
      yearRows++;
      if (p.status) a.status = p.status;
      if (p.startDate) a.startDate = p.startDate;
      if (p.endDate) a.endDate = p.endDate;
      if (p.boothNumber) a.boothNumber = p.boothNumber;
      if (p.boothSize) a.boothSize = p.boothSize;
      if (p.boothLayout) a.boothLayout = p.boothLayout;
      if (p.repsRaw) a.reps = resolveReps(p.repsRaw);
      if (p.boothRentalCost !== '') a.boothRentalCost = p.boothRentalCost;
      if (p.boothSetupCost !== '') a.boothSetupCost = p.boothSetupCost;
      if (p.otherCosts !== '') a.otherCosts = p.otherCosts;
      if (p.salesGenerated !== '') a.salesGenerated = p.salesGenerated;
      if (p.projectedPipeline !== '') a.projectedPipeline = p.projectedPipeline;
      if (p.notes) a.notes = p.notes;
    });
    shows.forEach(s => { if (!s.attendances.length) s.attendances.push(emptyAttendance()); });
    importPreview = null;
    if (rosterChanged) saveRoster();
    saveShows();
    showToast(`Imported ${createdShows} new event${createdShows === 1 ? '' : 's'} · ${yearRows} year row${yearRows === 1 ? '' : 's'}`);
    render();
  }

  function renderImportConfirm() {
    if (!importPreview) return '';

    return `
    <div class="confirm-overlay" id="import-overlay">
      <div class="confirm-box">

          <strong>${esc(importPreview.fileName)}</strong><br>
          ${su.rows} row${su.rows === 1 ? '' : 's'} · ${su.shows} event${su.shows === 1 ? '' : 's'}
          (${su.newShows} new, ${su.updatedShows} existing)${su.skipped ? ` · ${su.skipped} row${su.skipped === 1 ? '' : 's'} skipped (no name)` : ''}.

        <p style="font-size:12px;color:var(--text-muted);margin:0 0 18px">

          <button class="btn-secondary btn-sm" id="import-cancel">Cancel</button>

  // ---------- Render ----------
  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(str) {
    return (str || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderStarRating(value, interactive, onClick) {
    let html = '<div class="star-rating">';
    for (let i = 1; i <= 5; i++) {
      html += `<button type="button" class="${i <= value ? 'filled' : ''}" data-star="${i}" ${interactive ? '' : 'tabindex="-1" style="cursor:default"'}>★</button>`;
    }
    html += '</div>';
    return html;
  }

  function renderYearCompare() {

  function renderShowCard(show) {
    const latest = latestAttendance(show);
    const roi = latest ? calcROI(latest) : 0;
    const repsList = latest ? latest.reps.map(repName).sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'})).join(', ') : '';

  // render() rebuilds the whole page, which would reset scroll position and drop
  // keyboard focus (the "form jumps around" problem). Save and restore both.
  function captureUIState() {
    const app = document.getElementById('app');
    const overlay = document.querySelector('.modal-overlay');
    const ae = document.activeElement;
    const hasFocus = ae && ae.id && app && app.contains(ae);
    let selStart = null, selEnd = null;
    if (hasFocus) { try { selStart = ae.selectionStart; selEnd = ae.selectionEnd; } catch (e) {} }
    return {
      overlayTop: overlay ? overlay.scrollTop : null,
      winX: window.scrollX, winY: window.scrollY,
      focusId: hasFocus ? ae.id : null, selStart, selEnd
    };
  }
  function restoreUIState(st) {
    if (!st) return;
    const overlay = document.querySelector('.modal-overlay');
    if (overlay && st.overlayTop != null) overlay.scrollTop = st.overlayTop;
    window.scrollTo(st.winX, st.winY);
    if (st.focusId) {
      const el = document.getElementById(st.focusId);
      if (el) {
        el.focus({ preventScroll: true });
        if (st.selStart != null) { try { el.setSelectionRange(st.selStart, st.selEnd); } catch (e) {} }
      }
    }
  }

  function attachListeners() {
    const app = document.getElementById('app');

    const on = (sel, evt, fn, multi) => {
      const nodes = multi ? app.querySelectorAll(sel) : [app.querySelector(sel)];
      nodes.forEach(n => { if (n) n.addEventListener(evt, fn); });
    };

    on('#add-show-btn', 'click', openNewShowModal);
    on('#export-xlsx-btn', 'click', exportToExcel);
    on('#import-xlsx-btn', 'click', () => { const inp = document.getElementById('import-file-input'); if (inp) inp.click(); });
    const importInput = document.getElementById('import-file-input');
    if (importInput) importInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) handleImportFile(e.target.files[0]);
      e.target.value = '';
    });
    on('#signout-btn', 'click', signOutUser);
    on('#search-input', 'input', (e) => { searchQuery = e.target.value; render(); document.getElementById('search-input').focus(); document.getElementById('search-input').setSelectionRange(searchQuery.length, searchQuery.length); });
    on('#sort-select', 'change', (e) => { sortMode = e.target.value; render(); });
    app.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => { viewMode = btn.getAttribute('data-view'); render(); });
    });
    app.querySelectorAll('[data-type-filter]').forEach(btn => {
      btn.addEventListener('click', () => { typeFilter = btn.getAttribute('data-type-filter'); render(); });
    });
    app.querySelectorAll('[data-plan-year]').forEach(btn => {
      btn.addEventListener('click', () => {
        const v = btn.getAttribute('data-plan-year');
        planningYear = v === 'all' ? 'all' : parseInt(v);
        render();
      });
    });
    on('#plan-sort-toggle', 'click', () => { planSortDir = planSortDir === 'asc' ? 'desc' : 'asc'; render(); });

    app.querySelectorAll('[data-open-show]').forEach(card => {
      card.addEventListener('click', () => openShowModal(card.getAttribute('data-open-show'), card.getAttribute('data-open-att')));
    });
    app.querySelectorAll('.show-card-link').forEach(link => {
      link.addEventListener('click', (e) => e.stopPropagation());
    });

    // Modal-level
    on('#close-modal-btn', 'click', closeModal);
    on('#cancel-modal-btn', 'click', closeModal);
    on('#save-modal-btn', 'click', async () => {
      await closeModal(); // closeModal persists (local + cloud) and flushes live updates
      showToast('Saved');
    });
    on('#modal-overlay', 'click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
    on('#delete-show-btn', 'click', () => { confirmDelete = {type:'show', showId: modalShowId}; render(); });
    on('#add-year-btn', 'click', addAttendanceYear);

    app.querySelectorAll('[data-year-tab]').forEach(tab => {
      tab.addEventListener('click', () => { modalActiveAttendanceId = tab.getAttribute('data-year-tab'); render(); });
    });

    on('#delete-year-btn', 'click', (e) => {
      confirmDelete = {type:'attendance', showId: modalShowId, attendanceId: e.target.getAttribute('data-att')};
      render();
    });

    // Show-level fields
    const nameInput = document.getElementById('f-name');
    if (nameInput) nameInput.addEventListener('input', (e) => { getModalShow().name = e.target.value; document.querySelector('.modal-header h2').textContent = e.target.value || 'New event'; });
    const typeSelect = document.getElementById('f-type');
    if (typeSelect) typeSelect.addEventListener('change', (e) => { getModalShow().type = e.target.value; });
    const locInput = document.getElementById('f-location');
    if (locInput) locInput.addEventListener('input', (e) => { getModalShow().location = e.target.value; });
    const websiteInput = document.getElementById('f-website');
    if (websiteInput) websiteInput.addEventListener('input', (e) => { getModalShow().website = e.target.value; });
    const contactNameInput = document.getElementById('f-contact-name');
    if (contactNameInput) contactNameInput.addEventListener('input', (e) => { getModalShow().contactName = e.target.value; });
    const contactEmailInput = document.getElementById('f-contact-email');
    if (contactEmailInput) contactEmailInput.addEventListener('input', (e) => { getModalShow().contactEmail = e.target.value; });
    const locNotes = document.getElementById('f-locnotes');
    if (locNotes) locNotes.addEventListener('input', (e) => { getModalShow().locationNotes = e.target.value; });
    const genNotes = document.getElementById('f-gennotes');
    if (genNotes) genNotes.addEventListener('input', (e) => { getModalShow().generalNotes = e.target.value; });

    app.querySelectorAll('.star-rating button[data-star]').forEach((btn, idx, arr) => {
      // only the show-level rating is interactive (it's the only star-rating in the doc with data-star + not disabled style)
      if (btn.closest('.star-rating').parentElement.querySelector('label')?.textContent.includes('Overall rating')) {
        btn.addEventListener('click', () => setRating(parseInt(btn.getAttribute('data-star'))));
      }
    });

    // Attendance-level fields
    const bindAtt = (id, field, parser) => {
      const node = document.getElementById(id);
      if (!node) return;
      const setVal = (e) => {
        const s = getModalShow(); if (!s) return;
        const a = s.attendances.find(a => a.id === node.getAttribute('data-att')); if (!a) return;
        a[field] = parser ? parser(e.target.value) : e.target.value;
      };
      // Update silently while typing (keeps focus); re-render only on commit
      // (blur for text/number, immediate for selects) so derived UI like the
      // ROI box and year-tab labels stay current.
      node.addEventListener('input', setVal);
      // Defer the re-render until focus has moved (Tab/click) so the newly focused
      // field is the one that gets focus restored.
      node.addEventListener('change', (e) => { setVal(e); setTimeout(render, 0); });
    };
    bindAtt('f-year', 'year', v => parseInt(v) || new Date().getFullYear());
    bindAtt('f-status', 'status');
    bindAtt('f-layout', 'boothLayout');
    bindAtt('f-boothnum', 'boothNumber');
    bindAtt('f-boothsize', 'boothSize');
    bindAtt('f-rental', 'boothRentalCost');
    bindAtt('f-rental-year', 'boothRentalYear', v => parseInt(v) || new Date().getFullYear());
    bindAtt('f-setup', 'boothSetupCost');
    bindAtt('f-setup-year', 'boothSetupYear', v => parseInt(v) || new Date().getFullYear());
    bindAtt('f-other', 'otherCosts');

    // Date & contact fields: update without a full re-render so the native date
    // picker doesn't close mid-selection and text typing stays smooth
    const setContactField = (id, field) => {
      const node = document.getElementById(id);
      if (!node) return null;
      node.addEventListener('input', (e) => {
        const s = getModalShow(); if (!s) return;
        const a = s.attendances.find(a => a.id === node.getAttribute('data-att')); if (!a) return;
        a[field] = e.target.value;
      });
      return node;
    };
    setContactField('f-startdate', 'startDate');
    setContactField('f-enddate', 'endDate');
    setContactField('f-setup-contact', 'boothSetupContact');
    const emailNode = setContactField('f-setup-email', 'boothSetupContactEmail');
    if (emailNode) emailNode.addEventListener('input', (e) => {
      const link = document.getElementById('f-setup-email-link');
      if (!link) return;
      const v = e.target.value.trim();
      link.href = 'mailto:' + v;
      link.innerHTML = '<i class="ti ti-mail" style="font-size:12px"></i> Email ' + esc(v);
      link.style.display = v ? '' : 'none';
    });
    bindAtt('f-sales', 'salesGenerated');
    bindAtt('f-pipeline', 'projectedPipeline');
    bindAtt('f-yearnotes', 'notes');

    const repSelect = document.getElementById('f-rep-select');
    if (repSelect) repSelect.addEventListener('change', (e) => {
      const attId = repSelect.getAttribute('data-att');
      addRepToAttendance(attId, e.target.value);
    });
    const repNew = document.getElementById('f-rep-new');
    if (repNew) repNew.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const attId = repNew.getAttribute('data-att');
        addNewRepInline(attId, repNew.value);
        repNew.value = '';
      }
    });
    app.querySelectorAll('[data-rm-rep]').forEach(btn => {
      btn.addEventListener('click', () => removeRepFromAttendance(btn.getAttribute('data-att'), btn.getAttribute('data-rm-rep')));
    });

    // Image upload
    const uploadZone = document.getElementById('upload-zone');
    const fileInput = document.getElementById('file-input');
    if (uploadZone && fileInput) {
      uploadZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        handleFiles(uploadZone.getAttribute('data-att'), e.target.files);
        fileInput.value = '';
      });
      uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
      uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
      uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        handleFiles(uploadZone.getAttribute('data-att'), e.dataTransfer.files);
      });
    }
    app.querySelectorAll('[data-rm-img]').forEach(btn => {
      btn.addEventListener('click', () => removeImage(btn.getAttribute('data-att'), btn.getAttribute('data-rm-img')));
    });

    // Supporting file upload
    const fileZone = document.getElementById('file-upload-zone');
    const docInput = document.getElementById('doc-file-input');
    if (fileZone && docInput) {
      fileZone.addEventListener('click', () => docInput.click());
      docInput.addEventListener('change', (e) => {
        handleSupportingFiles(fileZone.getAttribute('data-att'), e.target.files);
        docInput.value = '';
      });
      fileZone.addEventListener('dragover', (e) => { e.preventDefault(); fileZone.classList.add('dragover'); });
      fileZone.addEventListener('dragleave', () => fileZone.classList.remove('dragover'));
      fileZone.addEventListener('drop', (e) => {
        e.preventDefault();
        fileZone.classList.remove('dragover');
        handleSupportingFiles(fileZone.getAttribute('data-att'), e.dataTransfer.files);
      });
    }
    app.querySelectorAll('[data-rm-file]').forEach(btn => {
      btn.addEventListener('click', () => removeSupportingFile(btn.getAttribute('data-att'), btn.getAttribute('data-rm-file')));
    });

    // Confirm dialog
    on('#confirm-cancel', 'click', () => { confirmDelete = null; render(); });
    on('#confirm-ok', 'click', () => {
      if (!confirmDelete) return;
      if (confirmDelete.type === 'show') deleteShow(confirmDelete.showId);
      else deleteAttendance(confirmDelete.attendanceId);
    });
    on('#confirm-overlay', 'click', (e) => { if (e.target.id === 'confirm-overlay') { confirmDelete = null; render(); } });

    // Import dialog
    on('#import-cancel', 'click', () => { importPreview = null; render(); });
    on('#import-ok', 'click', applyImport);
    on('#import-overlay', 'click', (e) => { if (e.target.id === 'import-overlay') { importPreview = null; render(); } });
  }

  // ---------- Startup ----------
  let dataStarted = false;
  function startApp() {
    if (dataStarted) { render(); return; }
    dataStarted = true;
    loadData();
  }
  if (requireAuth) {
    // Wait for Firebase to resolve the session before loading any (rule-protected) data.
    const app = document.getElementById('app');
    if (app) app.innerHTML = '<div class="loading-screen">Checking sign-in…</div>';
    auth.onAuthStateChanged(user => {
      currentUser = user || null;
      if (user) startApp();        // startApp guards against double-subscribing
      else renderSignIn();
    });
  } else {
    startApp();
  }
})();
</script>
</body>
</html>
